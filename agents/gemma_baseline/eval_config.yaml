# Per-task budgets. The tool call limit ends runs. The time limit is only a safety net,
# because real time depends on the GPU and how many tasks share it. The first baseline
# used 4 minutes to fit Kaggle's 12-hour limit, and its archives record that.
evaluation:
  timeout_seconds: 120
  max_tool_calls: 50
  max_time_minutes: 15
  max_turns: 80
